<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Tarun Kumar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="navbar">
            <a href="#" class="logo">TEMP<span>.</span></a>

            <span class="nav-title">
                OIBSIP | Task 3
            </span>
        </nav>
    </header>


    <!-- Main -->
    <main>

        <section class="converter-section">

            <div class="converter-container">

                <div class="intro">
                    <p class="tagline">TEMPERATURE CONVERTER</p>

                    <h1>
                        Convert temperatures
                        <span>easily.</span>
                    </h1>

                    <p>
                        Enter a temperature, choose the unit and instantly
                        convert it into Celsius, Fahrenheit and Kelvin.
                    </p>
                </div>


                <!-- Converter Card -->
                <div class="converter-card">

                    <div class="input-group">

                        <label for="temperature">
                            Enter Temperature
                        </label>

                        <input
                            type="number"
                            id="temperature"
                            placeholder="Enter value"
                            step="any"
                        >

                    </div>


                    <div class="input-group">

                        <label for="unit">
                            Select Unit
                        </label>

                        <select id="unit">

                            <option value="celsius">
                                Celsius (°C)
                            </option>

                            <option value="fahrenheit">
                                Fahrenheit (°F)
                            </option>

                            <option value="kelvin">
                                Kelvin (K)
                            </option>

                        </select>

                    </div>


                    <button id="convertBtn">
                        Convert Temperature →
                    </button>


                    <div id="message"></div>


                    <!-- Results -->
                    <div class="results">

                        <div class="result-box">
                            <span>Celsius</span>
                            <strong id="celsiusResult">
                                -- °C
                            </strong>
                        </div>

                        <div class="result-box">
                            <span>Fahrenheit</span>
                            <strong id="fahrenheitResult">
                                -- °F
                            </strong>
                        </div>

                        <div class="result-box">
                            <span>Kelvin</span>
                            <strong id="kelvinResult">
                                -- K
                            </strong>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Tarun Kumar | OIBSIP Level 1 - Task 3
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
